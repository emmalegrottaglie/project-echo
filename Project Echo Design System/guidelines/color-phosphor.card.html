<!-- @dsCard group="Colors" viewport="700x170" name="Phosphor green" subtitle="Six roles: bg, panel, fg, dim, accent, border" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Phosphor green</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div><div style="height:56px;background:var(--bg);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">bg</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#060a06</div></div><div><div style="height:56px;background:var(--panel);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">panel</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#0c130c</div></div><div><div style="height:56px;background:var(--fg);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">fg</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#b8f5c0</div></div><div><div style="height:56px;background:var(--dim);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">dim</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#6f9c76</div></div><div><div style="height:56px;background:var(--accent);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">accent</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#4ade80</div></div><div><div style="height:56px;background:var(--border);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">border</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#1d2f1f</div></div>
</div>
<p class="mono" style="margin:var(--space-4) 0 0;font-size:var(--text-label);color:var(--dim)">data-theme="phosphor" — the default. fg on bg 16.0:1</p>
</body>
</html>
