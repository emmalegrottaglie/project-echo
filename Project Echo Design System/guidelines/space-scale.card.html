<!-- @dsCard group="Spacing" viewport="700x170" name="Space scale" subtitle="4px base, six steps" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Space scale</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row" style="gap:var(--space-4);align-items:flex-end">
<div><div style="width:4px;height:4px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">4</div><div class="mono" style="font-size:11px;color:var(--dim)">space-1</div></div><div><div style="width:8px;height:8px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">8</div><div class="mono" style="font-size:11px;color:var(--dim)">space-2</div></div><div><div style="width:12px;height:12px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">12</div><div class="mono" style="font-size:11px;color:var(--dim)">space-3</div></div><div><div style="width:16px;height:16px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">16</div><div class="mono" style="font-size:11px;color:var(--dim)">space-4</div></div><div><div style="width:24px;height:24px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">24</div><div class="mono" style="font-size:11px;color:var(--dim)">space-5</div></div><div><div style="width:32px;height:32px;background:var(--accent)"></div><div class="mono" style="font-size:var(--text-label);color:var(--dim);padding-top:var(--space-2)">32</div><div class="mono" style="font-size:11px;color:var(--dim)">space-6</div></div>
</div>
<p style="margin:var(--space-4) 0 0;font-size:var(--text-label);color:var(--dim)">--gutter is space-4 (16px): the horizontal inset of every row, header and sheet.</p>
</body>
</html>
