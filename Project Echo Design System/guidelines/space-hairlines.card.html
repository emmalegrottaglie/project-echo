<!-- @dsCard group="Spacing" viewport="700x200" name="Hairlines and elevation" subtitle="1px borders and two surfaces — no drop shadows" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Hairlines and elevation</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row" style="gap:var(--space-4);align-items:stretch">
<div style="flex:1;padding:var(--space-3);background:var(--bg);border:1px solid var(--border)"><div class="lab">bg</div><div style="font-size:var(--text-label);color:var(--dim)">page ground</div></div>
<div style="flex:1;padding:var(--space-3);background:var(--panel);border:1px solid var(--border)"><div class="lab">panel</div><div style="font-size:var(--text-label);color:var(--dim)">rows, bars, cards</div></div>
<div style="flex:1;padding:var(--space-3);background:var(--surface-elevated);border:1px solid var(--border)"><div class="lab">surface-elevated</div><div style="font-size:var(--text-label);color:var(--dim)">sheets, one step up</div></div>
</div>
<p style="margin:var(--space-4) 0 0;font-size:var(--text-label);color:var(--dim);max-width:70ch">Cards in this system are a panel ground plus a 1px --border hairline and a 3px radius. No drop shadow, no coloured left border as decoration — the only 2px left rail in the app is the status line's tone indicator.</p>
</body>
</html>
