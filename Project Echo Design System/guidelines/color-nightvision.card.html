<!-- @dsCard group="Colors" viewport="700x170" name="Night-vision red" subtitle="Six roles: bg, panel, fg, dim, accent, border" -->
<!doctype html>
<html lang="en" data-theme="nightvision">
<head><meta charset="utf-8"><title>Night-vision red</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div><div style="height:56px;background:var(--bg);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">bg</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#0a0000</div></div><div><div style="height:56px;background:var(--panel);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">panel</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#150202</div></div><div><div style="height:56px;background:var(--fg);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">fg</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#f7b8b8</div></div><div><div style="height:56px;background:var(--dim);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">dim</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#b06a6a</div></div><div><div style="height:56px;background:var(--accent);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">accent</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#f87171</div></div><div><div style="height:56px;background:var(--border);border:1px solid var(--border)"></div><div class="lab" style="margin-top:var(--space-2)">border</div><div class="mono" style="font-size:var(--text-label);color:var(--dim)">#341010</div></div>
</div>
<p class="mono" style="margin:var(--space-4) 0 0;font-size:var(--text-label);color:var(--dim)">data-theme="nightvision" — fg on bg 12.3:1. The accent is red, so --danger moves to orange.</p>
</body>
</html>
