<!-- @dsCard group="Spacing" viewport="700x180" name="Radius" subtitle="3px controls, 12px sheets, 0 on the waterfall" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row" style="gap:var(--space-4)">
<div><div style="width:120px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-control)"></div><div class="lab" style="padding-top:var(--space-2)">control · 3px</div></div>
<div><div style="width:120px;height:56px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0"></div><div class="lab" style="padding-top:var(--space-2)">sheet · 12px top</div></div>
<div><div style="width:120px;height:56px;background:var(--wf-01);border-radius:var(--radius-instrument)"></div><div class="lab" style="padding-top:var(--space-2)">instrument · 0</div></div>
</div>
<p style="margin:var(--space-4) 0 0;font-size:var(--text-label);color:var(--dim)">The instrument is square; the interface is slightly soft.</p>
</body>
</html>
