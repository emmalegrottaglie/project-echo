<!-- @dsCard group="Motion" viewport="700x200" name="Easing" subtitle="Out for entering, in for leaving, inout for moving between positions" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Easing</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row" style="gap:var(--space-5)">
<div><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="var(--panel)" stroke="var(--border)"/><path d="M0,56 C12,56 44,0 56,0" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg><div class="mono" style="font-size:var(--text-label);color:var(--accent);padding-top:var(--space-2)">--ease-out</div><div class="mono" style="font-size:11px;color:var(--dim)">cubic-bezier(0.2, 0, 0.2, 1)</div><div style="font-size:var(--text-label);color:var(--dim)">entering or settling</div></div><div><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="var(--panel)" stroke="var(--border)"/><path d="M0,56 C22,56 56,28 56,0" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg><div class="mono" style="font-size:var(--text-label);color:var(--accent);padding-top:var(--space-2)">--ease-in</div><div class="mono" style="font-size:11px;color:var(--dim)">cubic-bezier(0.4, 0, 1, 1)</div><div style="font-size:var(--text-label);color:var(--dim)">leaving</div></div><div><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="var(--panel)" stroke="var(--border)"/><path d="M0,56 C22,56 34,0 56,0" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg><div class="mono" style="font-size:var(--text-label);color:var(--accent);padding-top:var(--space-2)">--ease-inout</div><div class="mono" style="font-size:11px;color:var(--dim)">cubic-bezier(0.4, 0, 0.2, 1)</div><div style="font-size:var(--text-label);color:var(--dim)">moving on screen</div></div>
</div>
</body>
</html>
