<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="No logo exists in the source — the name set in mono is the mark" -->
<!doctype html>
<html lang="en" data-theme="phosphor">
<head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}body{padding:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.mono{font-family:var(--font-mono)}.grid{display:grid;gap:var(--space-2)}.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}</style></head>
<body>
<div style="padding:var(--space-4) 0;font-family:var(--font-mono);font-weight:600;font-size:28px;letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--accent)">Project Echo</div>
<div class="row" style="gap:var(--space-4)">
<span data-theme="phosphor" style="padding:var(--space-2) var(--space-3);background:var(--bg);border:1px solid var(--border);font-family:var(--font-mono);font-weight:600;font-size:var(--text-body);letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--accent)">Project Echo</span><span data-theme="amber" style="padding:var(--space-2) var(--space-3);background:var(--bg);border:1px solid var(--border);font-family:var(--font-mono);font-weight:600;font-size:var(--text-body);letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--accent)">Project Echo</span><span data-theme="midnight" style="padding:var(--space-2) var(--space-3);background:var(--bg);border:1px solid var(--border);font-family:var(--font-mono);font-weight:600;font-size:var(--text-body);letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--accent)">Project Echo</span><span data-theme="nightvision" style="padding:var(--space-2) var(--space-3);background:var(--bg);border:1px solid var(--border);font-family:var(--font-mono);font-weight:600;font-size:var(--text-body);letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--accent)">Project Echo</span>
</div>
<p style="margin:var(--space-3) 0 0;font-size:var(--text-label);color:var(--dim);max-width:72ch">The repository ships no logo, icon or brand image, and none should be drawn: no branding may imply affiliation with any intelligence service, real or historical. The aesthetic references the equipment, not the institutions.</p>
</body>
</html>
