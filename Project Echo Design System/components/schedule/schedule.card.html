<div id="root"></div>
<script type="text/babel">
const { ScheduleRow, AlertSwitch, CoverageNote, Button } = window.ProjectEchoDesignSystem_453425;
function Card(){
  const [on, setOn] = React.useState(true);
  return (
    <div className="wrap">
      <div className="panel">
