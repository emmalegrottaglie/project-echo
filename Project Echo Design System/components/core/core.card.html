<!doctype html>
<html lang="en" data-theme="phosphor">
<head>
<meta charset="utf-8">
<title>Core controls</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--text-body)/var(--leading-body) var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}.wrap{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}.lab{color:var(--dim);font:var(--text-label)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-2)}.panel{border:1px solid var(--border);background:var(--panel)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, SegmentedControl, SearchField, ThemePicker, Skeleton } = window.ProjectEchoDesignSystem_453425;
function Card(){
  const [tier, setTier] = React.useState('live');
  const [q, setQ] = React.useState('S28');
  return (
    <div className="wrap">
      <div className="col">
        <span className="lab">Button — variant</span>
        <div className="row">
          <Button variant="primary" size="lg">Connect</Button>
          <Button size="lg">Synthetic marker</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger">Forget receiver</Button>
          <Button disabled>Stop</Button>
        </div>
      </div>
      <div className="col">
        <span className="lab">Segmented control — tier filter</span>
        <SegmentedControl value={tier} onChange={setTier} options={[
          {value:'',label:'All'},{value:'live',label:'Live'},{value:'scheduled',label:'Scheduled'},{value:'historical',label:'Historical'}]} />
      </div>
      <div className="col">
        <span className="lab">Search field · Theme picker</span>
        <div className="row" style={{gap:'var(--space-4)'}}>
          <div style={{flex:'1 1 300px'}}><SearchField value={q} onChange={setQ} /></div>
          <ThemePicker value="phosphor" />
        </div>
      </div>
      <div className="col">
        <span className="lab">Skeleton — directory loading</span>
        <div className="panel" style={{padding:'0 var(--space-3)'}}><Skeleton rows={2} /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
