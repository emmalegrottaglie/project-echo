<!doctype html>
<html lang="en" data-theme="phosphor">
<head>
<meta charset="utf-8">
<title>Project Echo</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:grid;grid-template-columns:1fr 160px}.mark{display:grid;place-items:center;background:#060a06}.mark span{font-family:var(--font-mono);font-weight:600;font-size:132px;letter-spacing:0.08em;text-transform:uppercase;color:#4ade80;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head>
<body>
<div class="mark"><span>Echo</span></div>
<div class="strip">
<div style="background:#4ade80"></div>
<div style="background:#fbbf24"></div>
<div style="background:#38bdf8"></div>
<div style="background:#f87171"></div>
</div>
</body>
</html>
