<!doctype html>
<html lang="en" data-theme="phosphor">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve, which the tab
         bar and transport bar both depend on. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      Content Security Policy.

      The whole interface is built by assigning strings to innerHTML, which is what makes
      this worth having: a value that reaches the page without being escaped is one
      mistake away from executing, and one of them did. It lives in the markup rather
      than in a response header because the client is built to run with no server at all
      — the Android wrapper loads these files from disk, and a header would protect only
      the case that needs protecting least.

      Two directives are wider than the rest, both for reasons that are in the code:

        connect-src / media-src http: https: ws: wss:
                              — two things here are addresses this app cannot know when
                                it is built. The receiver is whichever public KiwiSDR the
                                listener picks out of a directory of thousands, nearly all
                                of them plain ws://. And the server is wherever somebody
                                ran `npm start`, which the Android build has to be told,
                                because Capacitor serves the page from the phone and a
                                relative path never leaves it.

                                This is the weakest part of the policy and it is worth
                                being plain about: script is still confined to this app's
                                own bundle, which is what stops an injected value from
                                executing, but a script that did run could talk to any
                                host. The alternative was naming hosts that change daily,
                                or dropping the features that need them.
        style-src 'unsafe-inline'
                              — the timeline and the world map position elements with a
                                style attribute, because the coordinates are computed per
                                row. Nothing else needs it; a nonce cannot cover an
                                attribute.

      frame-ancestors is absent because a meta-tag policy may not carry it. The server
      sends it as a header instead, for the case where there is a server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data: https://prop.kc2g.com;
        media-src 'self' blob: http: https:;
        connect-src 'self' ws: wss: http: https:;
        worker-src blob:;
        form-action 'none'
      "
    />
    <title>Project Echo — shortwave marker monitor</title>
    <meta
      name="description"
      content="Channel-marker monitor and archive for shortwave numbers stations."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
